[project]
name = "source"
version = "0.0.5"
description = "SSO for Taxi project. Or any project with user authentication"
authors = [
    {name = "Maksim Tarasenko",email = "keltullis43@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (==0.115.0)",
    "loguru (==0.7.2)",
    "setproctitle (==1.3.3)",
    "gunicorn (==23.0.0)",
    "uvicorn (==0.30.6)",
    "databases (==0.9.0)",
    "asyncpg (==0.29.0)",
    "alembic (==1.13.3)",
    "python-dotenv (==1.0.1)",
    "psycopg2-binary (==2.9.9)",
    "bcrypt (==4.2.0)",
    "python-jose[cryptography] (==3.3.0)",
    "greenlet (==3.1.1)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "isort (>=6.0.1,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
